name: CI

# Fast, credential-free checks: type safety, Expo config health, a real bundle,
# and a headless run of the analysis/recommendation engines.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Expo Doctor
        run: npx --yes expo-doctor

      - name: Run analysis engine demo
        run: npm run demo

      - name: Bundle (iOS export)
        run: npx expo export --platform ios --output-dir /tmp/ie-export
